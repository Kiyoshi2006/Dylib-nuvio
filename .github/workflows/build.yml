name: Build Nuvio with Font Manageron:  workflow_dispatch:  push:    paths:      - '.github/workflows/build-nuvio-font-manager.yml'      - 'Tweak.m'      - 'inject.py'permissions:  contents: readjobs:  build:    runs-on: macos-latest    steps:      - uses: actions/checkout@v4      - name: Download Nuvio IPA        shell: bash        run: |          set -euo pipefail          url="$(python3 - <<'PY'          import json, urllib.request          u = 'https://raw.githubusercontent.com/NuvioMedia/NuvioMobile/cmp-rewrite/store.json'          d = json.load(urllib.request.urlopen(u, timeout=30))          print(d['apps'][0]['versions'][0]['downloadURL'])          PY          )"          echo "IPA source selected from Nuvio store.json"          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 -o nuvio.ipa "$url"          file nuvio.ipa          unzip -tq nuvio.ipa      - name: Extract IPA and validate app        run: |          set -euo pipefail          mkdir -p work          unzip -q nuvio.ipa -d work          app="$(find work/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"          test -n "$app"          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")          echo "APP_PATH=$app" >> "$GITHUB_ENV"          echo "APP_EXECUTABLE=$exe" >> "$GITHUB_ENV"          echo "APP_BUNDLE_ID=$bundle" >> "$GITHUB_ENV"          echo "Bundle: $bundle / executable: $exe"          file "$app/$exe"      - name: Compile arm64 dylib        run: |          set -euo pipefail          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc \            -miphoneos-version-min=16.0 \            -framework UIKit -framework Foundation -framework CoreText -framework CoreGraphics \            -framework UniformTypeIdentifiers \            -Wno-deprecated-declarations \            -install_name @rpath/NuvioFontManager.dylib \            -o NuvioFontManager.dylib Tweak.m          codesign -f -s - NuvioFontManager.dylib          file NuvioFontManager.dylib      - name: Inject dylib into Nuvio executable        run: |          set -euo pipefail          mkdir -p "$APP_PATH/Frameworks"          cp NuvioFontManager.dylib "$APP_PATH/Frameworks/NuvioFontManager.dylib"          python3 inject.py "$APP_PATH/$APP_EXECUTABLE" @rpath/NuvioFontManager.dylib          otool -L "$APP_PATH/$APP_EXECUTABLE" | grep -F NuvioFontManager          rm -rf "$APP_PATH/_CodeSignature"          (cd work && zip -qry ../Nuvio-FontManager.ipa Payload)          unzip -tq Nuvio-FontManager.ipa          ls -lh Nuvio-FontManager.ipa NuvioFontManager.dylib      - uses: actions/upload-artifact@v4        with:          name: Nuvio-FontManager-iOS-arm64          path: |            Nuvio-FontManager.ipa            NuvioFontManager.dylib          if-no-files-found: error          retention-days: 14
